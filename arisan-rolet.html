<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RODA ARFA - JPG SHARE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Poppins',sans-serif;background:#f1f5f9;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:10px 12px;text-align:center}
.card{background:#fff;border-radius:24px;padding:14px 12px 18px;box-shadow:0 10px 40px rgba(0,0,0,.12);position:relative;overflow:hidden}
.wheel-box{position:relative;width:min(84vw,340px);height:min(84vw,340px);margin:14px auto;z-index:1}
#wheelCanvas{width:100%;height:100%;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 6px #2563eb;display:block;will-change:transform;transform-origin:50% 50%}
.pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #dc2626;z-index:5}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:800;cursor:pointer}
.btn-spin{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:17px}
.btn-spin:disabled{opacity:.6}
.loading{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99;font-weight:700;color:#2563eb}
.card.disco::before{content:"";position:absolute;inset:-5px;background:conic-gradient(from 0deg,#ff0080,#ff8a00,#ffeb00,#00ff88,#00cfff,#8b5cf6,#ff0080);filter:blur(18px);opacity:.5;animation:rot .8s linear infinite;z-index:0}
@keyframes rot{to{transform:rotate(360deg)}}
#celebrationPage{position:fixed;inset:0;background:radial-gradient(circle at top,#1e40af,#0f172a);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:100;text-align:center;overflow:hidden}
#celebrationPage.show{display:flex}
#captureArea{position:relative;width:100%;max-width:360px;background:radial-gradient(circle at top,#1e40af,#0f172a);border-radius:24px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;border:2px solid rgba(255,255,255,.15)}
.confetti{position:absolute;top:-20px;width:12px;height:12px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0) translateX(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg) translateX(120px);opacity:0}}
.trophy-big{font-size:90px}
.text-menang{color:#facc15;font-size:12px;letter-spacing:2px;font-weight:800;margin-top:8px}
.nama-juara{font-size:52px;font-weight:900;color:#fff;line-height:.9;margin:12px 0;text-shadow:0 0 20px #22c55e}
.box-uang{background:#fff;color:#065f46;padding:10px 24px;border-radius:30px;font-weight:800;font-size:18px;margin-top:10px}
</style>
</head>
<body>
<div id="loading" class="loading">Memuat roda...</div>
<div id="pageRoda" class="container">
<div id="card" class="card">
<h3 id="judul" style="margin:0;color:#1e3a8a;z-index:1;position:relative">RODA ARISAN</h3>
<div id="putaran" style="background:#eff6ff;color:#2563eb;display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;margin-top:6px;z-index:1;position:relative;font-weight:700">-</div>
<div class="wheel-box"><div class="pin"></div><canvas id="wheelCanvas" width="620" height="620"></canvas></div>
<div id="status" style="font-size:12px;color:#64748b;z-index:1;position:relative;margin-top:10px;font-weight:600">Siap...</div>
<button id="btnSpin" class="btn btn-spin">🎡 PUTAR 10 DETIK</button>
</div>
</div>

<div id="celebrationPage">
<div id="confettiContainer" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>

<!-- AREA YANG DI-JPG-KAN PERSIS LAYAR -->
<div id="captureArea">
<div class="trophy-big">🏆</div>
<div class="text-menang">PEMENANG <span id="cJudul"></span></div>
<div style="color:#93c5fd;font-size:11px">PUTARAN <span id="cPutaran">6</span> - SAH</div>
<div id="cNama" class="nama-juara">B</div>
<div id="cUang" class="box-uang">Rp 700.000</div>
<div style="color:#fde68a;font-size:10px;margin-top:14px">🎉 Selamat yaa! 🎉</div>
<div style="color:#64748b;font-size:8px;margin-top:8px" id="cTanggal"></div>
</div>

<div style="display:grid;gap:10px;width:100%;max-width:320px;margin-top:20px;position:relative;z-index:2">
<button id="btnJPG" style="background:#fff;color:#1e3a8a;padding:14px;border:none;border-radius:14px;font-weight:800;font-size:15px">📸 Download JPG</button>
<button id="btnWA" style="background:#25D366;color:#fff;padding:14px;border:none;border-radius:14px;font-weight:800;font-size:15px">📲 Share JPG ke WA</button>
<button onclick="location.reload()" style="background:rgba(255,255,255,.15);color:#fff;padding:14px;border:none;border-radius:14px;font-weight:800">⬅️ Kembali ke Roda</button>
<button id="btnBatalCele" style="background:#f59e0b;color:#fff;padding:12px;border:none;border-radius:14px;font-weight:700;font-size:12px">🔄 Batalkan</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, update, push, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",authDomain:"arfa-c7dee.firebaseapp.com",databaseURL:"https://arfa-c7dee-default-rtdb.firebaseio.com",projectId:"arfa-c7dee"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const arisanId=new URLSearchParams(window.location.search).get("id");
let dataArisan,periode,daftar=[],daftarKocok=[],currentDeg=0,pemenangId,paksaAktif=null, lastWinData=null;
const canvas=document.getElementById("wheelCanvas"), ctx=canvas.getContext("2d");
const DURATION_MS=10000;
const colors=["#3b82f6","#10b981","#8b5cf6","#06b6d4","#f59e0b","#ef4444","#ec4899","#14b8a6"];
let audioCtx=null;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function playTick(v=1,p=1){ if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=900*p; o.type='square'; g.gain.setValueAtTime(0,audioCtx.currentTime); g.gain.linearRampToValueAtTime(v*0.35,audioCtx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.10); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.12); }
function playWin(){ if(!audioCtx) return; [523,659,784,1046].forEach((f,i)=>setTimeout(()=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(.6,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.7); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.7); }, i*130)); }
let tickTimer=null;
function startTicking(){ initAudio(); let e=0; const doTick=()=>{ let p=e/DURATION_MS; let iv=60+p*220; playTick(1-p*0.6, 1.2-p*0.4); e+=iv; if(e<DURATION_MS) tickTimer=setTimeout(doTick, iv); }; doTick(); }
function stopTicking(){ if(tickTimer) clearTimeout(tickTimer); }
function rupiah(n){return "Rp "+Number(n).toLocaleString("id-ID")}
function drawWheel(list){
  const n=list.length, cx=310,cy=310,r=280, ap=(2*Math.PI)/n;
  ctx.clearRect(0,0,620,620); let fs=n>10?14:n>6?18:22;
  list.forEach((id,i)=>{
    const ag=dataArisan.anggota[id], sudah=ag?.sudahDapat;
    const s=i*ap - Math.PI/2, e2=s+ap;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,s,e2);ctx.closePath();
    ctx.fillStyle=sudah?"#e5e7eb":colors[i%colors.length]; ctx.globalAlpha=sudah?0.45:1; ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
    let nama=(ag?.nama||"").slice(0,12);
    const mid=s+ap/2, tr=r*0.58, tx=cx+Math.cos(mid)*tr, ty=cy+Math.sin(mid)*tr;
    ctx.save();ctx.translate(tx,ty); let rot=mid; if(rot>Math.PI/2&&rot<Math.PI*1.5) rot+=Math.PI;
    ctx.rotate(rot); ctx.textAlign="center";ctx.fillStyle=sudah?"#9ca3af":"#fff"; ctx.font=`bold ${fs}px Poppins`; ctx.fillText(nama,0,0); ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,54,0,Math.PI*2);ctx.fillStyle="#0f172a";ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 19px Poppins";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("ARFA",cx,cy+3);
}
function launchConfettiFull(){
  const box=document.getElementById("confettiContainer"); box.innerHTML="";
  const cols=["#f59e0b","#10b981","#3b82f6","#ec4899","#facc15","#22c55e","#ffffff"];
  for(let i=0;i<80;i++){
    const d=document.createElement("div"); d.className="confetti";
    d.style.left=Math.random()*100+"%"; d.style.background=cols[Math.floor(Math.random()*cols.length)];
    d.style.animationDuration=(1+Math.random()*1.5)+"s"; d.style.animationDelay=(Math.random()*0.8)+"s";
    d.style.width=(8+Math.random()*10)+"px"; d.style.height=(8+Math.random()*10)+"px";
    d.style.borderRadius=Math.random()>0.5?"50%":"0"; box.appendChild(d);
  }
}
function showCelebrationPage(nama,total,p){
  lastWinData={nama,total,p, arisanNama:dataArisan.nama};
  document.getElementById("pageRoda").style.display="none";
  document.getElementById("cJudul").innerText=(dataArisan.nama||"ARISAN").toUpperCase();
  document.getElementById("cPutaran").innerText=p;
  document.getElementById("cNama").innerText=nama;
  document.getElementById("cUang").innerText=rupiah(total);
  document.getElementById("cTanggal").innerText=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById("celebrationPage").classList.add("show");
  launchConfettiFull(); playWin();
  if(navigator.vibrate) navigator.vibrate([100,50,100,50,300]);
}

// ===== FUNGSI JPG =====
async function generateJPG(){
  const area=document.getElementById("captureArea");
  const canvasJPG = await html2canvas(area, {scale:2, backgroundColor:null, useCORS:true});
  return canvasJPG;
}

document.getElementById("btnJPG").onclick=async()=>{
  const btn=document.getElementById("btnJPG");
  btn.innerText="⏳ Bikin JPG...";
  const c=await generateJPG();
  const link=document.createElement("a");
  link.download=`PEMENANG-${lastWinData.nama}-P${lastWinData.p}.jpg`;
  link.href=c.toDataURL("image/jpeg",0.95);
  link.click();
  btn.innerText="📸 Download JPG";
};

document.getElementById("btnWA").onclick=async()=>{
  const btn=document.getElementById("btnWA");
  btn.innerText="⏳ Bikin JPG...";
  const c=await generateJPG();
  c.toBlob(async (blob)=>{
    const file=new File([blob], `pemenang-${lastWinData.nama}.jpg`, {type:"image/jpeg"});
    const text=`🏆 PEMENANG ${lastWinData.arisanNama}\nP${lastWinData.p} - ${lastWinData.nama} - ${rupiah(lastWinData.total)}`;
    // coba share pakai file (Android bisa share langsung ke WA)
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:"Pemenang Arisan", text:text});
      }catch(e){}
    } else {
      // fallback: download + buka WA text
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=file.name; a.click();
      setTimeout(()=>{
        const waText=`🏆 *PEMENANG ${lastWinData.arisanNama?.toUpperCase()}*\nPutaran P${lastWinData.p}\nPemenang: *${lastWinData.nama}*\nTotal: *${rupiah(lastWinData.total)}*\n\n(Gambar JPG sudah ter-download, tinggal attach di WA)`;
        window.open(`https://wa.me/?text=${encodeURIComponent(waText)}`,'_blank');
      },500);
    }
    btn.innerText="📲 Share JPG ke WA";
  }, "image/jpeg", 0.95);
};

async function load(){
  const snap=await get(ref(db,`/arisan/${arisanId}`)); dataArisan=snap.val(); periode=Number(dataArisan.periodeSekarang)||1;
  document.getElementById("judul").innerText=dataArisan.nama||"RODA ARISAN";
  document.getElementById("putaran").innerText="Putaran "+periode;
  const snapTrans=await get(ref(db,`/arisan_transaksi/${arisanId}/${periode}`));
  if(snapTrans.exists()){
    const trans=Object.values(snapTrans.val())[0]; daftar=Object.keys(dataArisan.anggota); drawWheel(daftar);
    showCelebrationPage(trans.namaPemenang,trans.totalKas,periode); return;
  }
  const semua=Object.entries(dataArisan.anggota); daftar=semua.map(([k])=>k);
  const paksa=semua.find(([k,v])=>v.kunciMenang&&!v.sudahDapat);
  if(paksa){ paksaAktif=paksa; daftarKocok=[paksa[0]]; } else { const belum=semua.filter(([k,v])=>!v.sudahDapat); daftarKocok=belum.filter(([k,v])=>!v.kunciTerakhir&&!v.kunciTahan).map(([k])=>k); }
  drawWheel(daftar);
  document.getElementById("status").innerText=`Siap! ${daftar.length} anggota`;
}
document.getElementById("btnSpin").onclick=async()=>{
  initAudio(); startTicking();
  document.getElementById("card").classList.add("disco");
  document.getElementById("btnSpin").disabled=true;
  if(paksaAktif) pemenangId=paksaAktif[0];
  else { let last=localStorage.getItem("lastWinner_"+arisanId); let t=0; do{ pemenangId=daftarKocok[Math.floor(Math.random()*daftarKocok.length)]; t++; }while(pemenangId===last&&daftarKocok.length>1&&t<20); localStorage.setItem("lastWinner_"+arisanId,pemenangId); }
  const idx=daftar.indexOf(pemenangId), ap=360/daftar.length, center=idx*ap+ap/2, target=(360-center+360)%360, extra=360*12, finalDeg=extra+target;
  canvas.style.transition='none'; canvas.style.transform=`rotate(${currentDeg%360}deg)`; void canvas.offsetWidth;
  canvas.style.transition=`transform ${DURATION_MS}ms cubic-bezier(0.15,0,0.15,1)`; canvas.style.transform=`rotate(${finalDeg}deg)`; currentDeg=finalDeg;
  document.getElementById("status").innerText=`🎡 Memutar...`;
  setTimeout(async()=>{
    stopTicking(); document.getElementById("card").classList.remove("disco");
    const iuran=Number(dataArisan.iuran)||0, jml=daftar.length, total=iuran*jml;
    const tRef=push(ref(db,`/arisan_transaksi/${arisanId}/${periode}`));
    await set(tRef,{tanggal:Date.now(),pemenangId,namaPemenang:dataArisan.anggota[pemenangId].nama,totalKas:total,periode});
    await update(ref(db,`/arisan/${arisanId}/anggota/${pemenangId}`),{sudahDapat:true,periodeDapat:periode,kunciMenang:false,kunciTahan:false});
    const menang=Object.values(dataArisan.anggota).filter(a=>a.sudahDapat).length+1;
    if(menang>=jml) await update(ref(db,`/arisan/${arisanId}`),{status:"selesai",periodeSekarang:periode});
    else await update(ref(db,`/arisan/${arisanId}`),{periodeSekarang:periode+1});
    showCelebrationPage(dataArisan.anggota[pemenangId].nama,total,periode);
  }, DURATION_MS+300);
};
document.getElementById("btnBatalCele").onclick=async()=>{
  if(!confirm(`Batalkan pemenang?`))return;
  await remove(ref(db,`/arisan_transaksi/${arisanId}/${periode}`));
  await update(ref(db,`/arisan/${arisanId}/anggota/${pemenangId}`),{sudahDapat:false,periodeDapat:null});
  await update(ref(db,`/arisan/${arisanId}`),{status:"aktif",periodeSekarang:periode});
  location.reload();
};
load().then(()=>document.getElementById("loading").style.display="none");
</script>
</body>
</html>
