<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolet Arisan - Koperasi ARFA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0;width:100%;min-height:100%}
body{font-family:'Poppins',sans-serif;background:radial-gradient(circle at top,#dbeafe 0%,#eff6ff 35%,#f8fafc 100%);color:#0f172a;overflow-x:hidden}
.container{width:100%;max-width:900px;margin:auto;padding:20px}
.title{text-align:center;margin-bottom:20px}.title h1{margin:0;font-size:25px;font-weight:800;color:#1d4ed8}.title p{margin:6px 0 0;color:#64748b;font-size:13px}
.rolet-card{background:rgba(255,255,255,.96);border-radius:28px;padding:25px 20px;box-shadow:0 20px 60px rgba(15,23,42,.12);text-align:center;position:relative;overflow:hidden}
.info{position:relative;z-index:2}.nama-arisan{font-size:18px;font-weight:800;color:#1e3a8a}
.putaran{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:700}
.area-kocok{position:relative;z-index:2;margin-top:35px}
.rolet-box{min-height:190px;display:flex;align-items:center;justify-content:center;padding:20px;border-radius:25px;background:linear-gradient(135deg,#1d4ed8,#2563eb,#3b82f6);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 18px 40px rgba(37,99,235,.28)}
.nama-rolet{color:white;font-size:clamp(24px,7vw,45px);font-weight:800;line-height:1.2;word-break:break-word;text-shadow:0 3px 10px rgba(0,0,0,.2)}
.rolet-box.berputar{animation:pulseBox.45s infinite alternate} @keyframes pulseBox{from{transform:scale(1)}to{transform:scale(1.025)}}
.status{margin-top:16px;min-height:24px;color:#64748b;font-size:13px;font-weight:500}
.btn{border:none;border-radius:14px;padding:13px 20px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}.btn:active{transform:scale(.97)}
.btn-sound{background:#2563eb;color:white;box-shadow:0 8px 22px rgba(37,99,235,.25);flex:1}.btn-sound.active{background:#16a34a}
.winner{position:relative;z-index:3;display:none;margin-top:20px}.winner.show{display:block;animation:winnerIn.7s ease}
@keyframes winnerIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.winner-icon{font-size:55px;margin-bottom:5px}.winner-label{color:#64748b;font-size:13px;font-weight:600}
.nama-pemenang{margin-top:5px;color:#16a34a;font-size:clamp(24px,7vw,38px);font-weight:800;line-height:1.2}
.nominal{margin-top:15px;padding:18px;border-radius:20px;background:#f0fdf4;border:1px solid #bbf7d0}
.nominal-label{font-size:12px;color:#64748b}.nominal-value{margin-top:3px;font-size:30px;font-weight:800;color:#15803d}
.detail-uang{margin-top:10px;color:#64748b;font-size:12px;line-height:1.7}
.action{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn-wa{background:#16a34a;color:white}.btn-print{background:#0f172a;color:white}.btn-close{background:#e2e8f0;color:#475569}.btn-ulang{background:#f59e0b;color:white;box-shadow:0 8px 18px rgba(245,158,11,.25)}
.btn-vol{background:#0f172a;color:white;padding:10px 16px;font-size:18px}
.error{position:relative;z-index:4;display:none;margin-top:20px;padding:18px;border-radius:18px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:13px;line-height:1.6}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.88);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:9999}
.spinner{width:45px;height:45px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin.8s linear infinite;margin:auto} @keyframes spin{to{transform:rotate(360deg)}}.loading-text{margin-top:12px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<div id="loading" class="loading"><div style="text-align:center"><div class="spinner"></div><div class="loading-text">Memuat data arisan...</div></div></div>
<div class="container">
  <div class="title"><h1>🎲 KOCOK ARISAN</h1></div>
  <div class="rolet-card">
    <div class="info"><div id="namaArisan" class="nama-arisan">-</div><div id="putaran" class="putaran">Putaran -</div></div>
    <div id="areaKocok" class="area-kocok"><div id="roletBox" class="rolet-box"><div id="nama" class="nama-rolet">Siap...</div></div><div id="status" class="status">Siap dikocok...</div></div>
    <div style="margin-top:20px;position:relative;z-index:3">
      <div style="display:flex;gap:8px;justify-content:center;align-items:center">
        <button id="btnVolMin" class="btn btn-vol">🔉</button>
        <button id="btnSound" class="btn btn-sound">🔊 MULAI KOCOK</button>
        <button id="btnVolPlus" class="btn btn-vol">🔊</button>
      </div>
      <div id="txtVolume" style="font-size:12px;color:#1e293b;margin-top:10px;text-align:center;font-weight:700;background:#f1f5f9;padding:6px 12px;border-radius:20px;display:inline-block">Volume: 100%</div>
    </div>
    <div id="winner" class="winner">
      <div class="winner-icon">🏆</div><div class="winner-label">PEMENANG ARISAN</div><div id="namaPemenang" class="nama-pemenang">-</div>
      <div class="nominal"><div class="nominal-label">Uang yang diterima</div><div id="nominal" class="nominal-value">Rp 0</div><div id="detailUang" class="detail-uang"></div></div>
      <div class="action">
        <button id="btnUlang" class="btn btn-ulang">🔄 Putar Ulang - Gak Jadi Ambil</button>
        <button id="btnWA" class="btn btn-wa">📱 Kirim WhatsApp</button>
        <button id="btnPrint" class="btn btn-print">🧾 Cetak Nota</button>
        <button class="btn btn-close" onclick="window.close()">✕ Tutup</button>
      </div>
    </div>
    <div id="error" class="error"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { apiKey: "AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo", authDomain: "arfa-c7dee.firebaseapp.com", databaseURL: "https://arfa-c7dee-default-rtdb.firebaseio.com", projectId: "arfa-c7dee" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const params = new URLSearchParams(window.location.search);
const arisanId = params.get("id");

let dataArisan=null,periode=1,pemenangId=null,pemenang=null,totalKas=0,jasa=0,diterima=0,daftarKocok=[],daftarTampil=[],audioCtx=null,drumTimer=null,roletSedangBerjalan=false,lastTransaksiKey=null;
let volumeLevel=1.0;

const loadingEl=document.getElementById("loading"),namaArisanEl=document.getElementById("namaArisan"),putaranEl=document.getElementById("putaran"),namaEl=document.getElementById("nama"),winnerEl=document.getElementById("winner"),namaPemenangEl=document.getElementById("namaPemenang"),nominalEl=document.getElementById("nominal"),detailUangEl=document.getElementById("detailUang"),statusEl=document.getElementById("status"),areaKocokEl=document.getElementById("areaKocok"),roletBoxEl=document.getElementById("roletBox"),errorEl=document.getElementById("error"),btnWA=document.getElementById("btnWA"),btnPrint=document.getElementById("btnPrint"),btnSound=document.getElementById("btnSound"),btnUlang=document.getElementById("btnUlang");

function rupiah(a){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(a)||0)}
function initAudio(){try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}}catch(e){}}
function updateVolumeUI(){const el=document.getElementById("txtVolume"); if(el) el.textContent=`Volume: ${Math.round(volumeLevel*100)}% ${volumeLevel>=1.2?'🔊🔊 BOOST':''}`}
function setVolume(delta){volumeLevel=Math.min(1.5,Math.max(0.05,volumeLevel+delta));updateVolumeUI();playTestSound();try{localStorage.setItem("rolet_volume",volumeLevel)}catch(e){}}
try{const s=parseFloat(localStorage.getItem("rolet_volume")); if(!isNaN(s)) volumeLevel=s; else volumeLevel=1.0;}catch(e){}
function playTestSound(){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.setValueAtTime(700,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(1000,audioCtx.currentTime+.12);g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.min(1.2, volumeLevel*0.8),audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2)}catch(e){}}
function playDrum(){initAudio();if(!audioCtx)return;if(audioCtx.state==="suspended")audioCtx.resume();if(drumTimer)clearInterval(drumTimer);const mulai=Date.now(),durasi=15000;drumTimer=setInterval(()=>{const el=Date.now()-mulai;if(el>=durasi){clearInterval(drumTimer);drumTimer=null;return}try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";let f=180+Math.random()*260;if(el>12000)f=130+Math.random()*180;o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(Math.min(1.2, volumeLevel*0.7),audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.065);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.07)}catch(e){}},85)}
function playMenang(){initAudio();if(!audioCtx)return;if(audioCtx.state==="suspended")audioCtx.resume();[523.25,659.25,783.99,1046.5,1046.5].forEach((f,i)=>{setTimeout(()=>{try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.min(1.2, volumeLevel*1.0),audioCtx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.45);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.5)}catch(e){}},i*180)})}

async function loadArisan(){if(!arisanId)throw new Error("ID arisan tidak ditemukan.");const snap=await get(ref(db,`/arisan/${arisanId}`));if(!snap.exists())throw new Error("Data arisan tidak ditemukan.");dataArisan=snap.val();if(dataArisan.status==="selesai")throw new Error("Arisan ini sudah selesai.");periode=Number(dataArisan.periodeSekarang)||1;namaArisanEl.textContent=dataArisan.nama||"Arisan";putaranEl.textContent="Putaran "+periode;await cekSetoran();}

async function cekSetoran(){
  const anggota=dataArisan.anggota||{};
  const jml=Object.keys(anggota).length;
  if(jml<2)throw new Error("Jumlah anggota belum mencukupi.");
  const snap=await get(ref(db,`/arisan_setoran/${arisanId}/${periode}`));
  const dataSetoran=snap.exists()?snap.val():{};
  let belum=Object.entries(anggota).filter(([id,a])=>a&&a.sudahDapat!==true);
  const kunci=belum.find(([id,a])=>a.kunciTerakhir===true);

  // TAMPIL = semua termasuk kunci (biar ikut muter)
  daftarTampil=belum.map(([id])=>id);
  // KOCOK = tanpa kunci
  if(kunci && belum.length>1){
    daftarKocok=belum.filter(([id])=>id!==kunci[0]).map(([id])=>id);
  } else {
    daftarKocok=belum.map(([id])=>id);
  }

  if(daftarTampil.length===0)throw new Error("Tidak ada anggota yang dapat dikocok.");
  const belumSetor=belum.filter(([id])=>!dataSetoran[id]);
  if(belumSetor.length>0){
    const namaBelum=belumSetor.map(([id,a])=>a.nama||id);
    throw new Error("Belum semua anggota membayar iuran periode ini:\n\n"+namaBelum.join(", "))
  }
  if(daftarKocok.length===0)throw new Error("Semua anggota terkunci, tidak ada yang bisa menang.");
}

async function mulaiRolet(){
  if(roletSedangBerjalan)return;
  if(!daftarKocok||daftarKocok.length===0){tampilError("Tidak ada peserta.");return}
  roletSedangBerjalan=true;
  btnSound.disabled=true;btnSound.classList.add("active");btnSound.textContent="🔊 KOCOK BERJALAN...";
  areaKocokEl.style.display="block";winnerEl.classList.remove("show");roletBoxEl.classList.add("berputar");
  statusEl.textContent="🎰 Pengundian berlangsung... ("+daftarTampil.length+" nama, "+daftarKocok.length+" yang bisa menang)";
  playDrum();

  const durasi=15000,mulai=Date.now();
  let index=Math.floor(Math.random()*daftarTampil.length);
  function getNama(id){const n=dataArisan.anggota?.[id]?.nama||id; const isKunci=dataArisan.anggota?.[id]?.kunciTerakhir; return isKunci? n+" " : n;}

  while(true){
    const elapsed=Date.now()-mulai; if(elapsed>=durasi)break;
    index=(index+1)%daftarTampil.length;
    namaEl.textContent=getNama(daftarTampil[index]);
    let delay=70; if(elapsed>=8000)delay=105; if(elapsed>=10500)delay=145; if(elapsed>=12000)delay=200; if(elapsed>=13500)delay=300; if(elapsed>=14500)delay=500;
    const sisa=durasi-elapsed; if(delay>sisa)delay=sisa; await new Promise(r=>setTimeout(r,delay));
  }
  if(drumTimer){clearInterval(drumTimer);drumTimer=null}

  const randomIndex=Math.floor(Math.random()*daftarKocok.length);
  pemenangId=daftarKocok[randomIndex];
  pemenang=dataArisan.anggota?.[pemenangId]||{};

  namaEl.textContent=pemenang.nama||pemenangId;
  statusEl.textContent="🎉 Pemenang telah ditentukan!";
  roletBoxEl.classList.remove("berputar");
  await new Promise(r=>setTimeout(r,700));
  await prosesPemenang();
}

async function prosesPemenang(){try{const iuran=Number(dataArisan.iuran)||0;const jumlahAnggota=Number(dataArisan.jumlahAnggota)||Object.keys(dataArisan.anggota||{}).length;totalKas=iuran*jumlahAnggota;jasa=Number(dataArisan.jasaKas)||0;diterima=Math.max(0,totalKas-jasa);
  const transaksiRef = push(ref(db,`/arisan_transaksi/${arisanId}/${periode}`));
lastTransaksiKey = transaksiRef.key;
await set(transaksiRef,{
  tanggal: Date.now(), // pakai angka, bukan ISO biar konsisten sama data lama kamu
  pemenangId,
  totalKas, jasaRp:jasa, diterima,
  metode:"rolet", periode,
  namaPemenang: pemenang.nama||pemenangId
});
  await update(ref(db,`/arisan/${arisanId}/anggota/${pemenangId}`),{sudahDapat:true, periodeDapat:periode});
  const anggotaIds=Object.keys(dataArisan.anggota||{});const sudahMenang=anggotaIds.filter(id=>{if(id===pemenangId)return true;return dataArisan.anggota?.[id]?.sudahDapat===true}).length;if(sudahMenang>=anggotaIds.length){await update(ref(db,`/arisan/${arisanId}`),{status:"selesai",periodeSekarang:periode})}else{await update(ref(db,`/arisan/${arisanId}`),{periodeSekarang:periode+1})}try{const logRef=push(ref(db,"/log_aktivitas"));await set(logRef,{waktu:new Date().toISOString(),aksi:"KOCOK_ARISAN",arisanId,periode,pemenang:pemenang.nama||pemenangId,nominal:diterima})}catch(e){}tampilkanPemenang();}catch(error){console.error(error);tampilError("Pemenang sudah ditentukan tetapi gagal simpan: "+error.message)}}
function tampilkanPemenang(){roletSedangBerjalan=false;areaKocokEl.style.display="none";winnerEl.classList.add("show");namaPemenangEl.textContent=pemenang.nama||pemenangId;nominalEl.textContent=rupiah(diterima);detailUangEl.innerHTML=`Total iuran: <b>${rupiah(totalKas)}</b><br>Jasa kas: <b>${rupiah(jasa)}</b><br>Diterima: <b>${rupiah(diterima)}</b>`;btnSound.style.display="none";document.getElementById("btnVolMin").style.display="none";document.getElementById("btnVolPlus").style.display="none";document.getElementById("txtVolume").style.display="none";playMenang();confetti();const hp=pemenang.hp||pemenang.telepon||pemenang.noTelepon||"";const nomor=String(hp).replace(/\D/g,"").replace(/^0/,"62");const pesan=`🎉 *PEMENANG ARISAN KOPERASI ARFA*\n\nNama: ${pemenang.nama||pemenangId}\nArisan: ${dataArisan.nama||"-"}\nPutaran: ${periode}\n\nTotal Iuran: ${rupiah(totalKas)}\nJasa Kas: ${rupiah(jasa)}\nDiterima: ${rupiah(diterima)}\n\nSelamat kepada pemenang! 🎊\n\n_Koperasi ARFA Sejahtera_`;btnWA.onclick=()=>{const url=nomor?`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`:`https://wa.me/?text=${encodeURIComponent(pesan)}`;window.open(url,"_blank")};btnPrint.onclick=()=>cetakNota();}

  async function putarUlang(){
  if(!pemenangId) return;
  if(!confirm(`Yakin batalkan "${pemenang.nama||pemenangId}" P${periode}?`)) return;
  try{
    loadingEl.style.display="flex";
    // Hapus SEMUA transaksi di periode ini, bukan cuma 1 key
    await set(ref(db,`/arisan_transaksi/${arisanId}/${periode}`),null);
    await update(ref(db,`/arisan/${arisanId}/anggota/${pemenangId}`),{sudahDapat:false, periodeDapat:null});
    const snapArisan=await get(ref(db,`/arisan/${arisanId}`));
    if((snapArisan.val()?.periodeSekarang||1) > periode){
      await update(ref(db,`/arisan/${arisanId}`),{status:"aktif", periodeSekarang:periode});
    }
    // reset UI
    winnerEl.classList.remove("show"); areaKocokEl.style.display="block";
    btnSound.style.display="block"; document.getElementById("btnVolMin").style.display="block";
    document.getElementById("btnVolPlus").style.display="block"; document.getElementById("txtVolume").style.display="inline-block";
    btnSound.disabled=false; btnSound.textContent="🔊 MULAI ROLET"; btnSound.classList.remove("active");
    statusEl.textContent="Dibatalkan. Siap dikocok ulang."; namaEl.textContent="Siap...";
    roletSedangBerjalan=false; pemenangId=null; pemenang=null; lastTransaksiKey=null;
    loadingEl.style.display="none"; alert("Dibatalkan! Putaran lama tetap aman.");
  }catch(e){ loadingEl.style.display="none"; alert("Gagal: "+e.message); }
}
btnUlang.onclick=putarUlang;
function cetakNota(){if(!window.jspdf||!window.jspdf.jsPDF){alert("Library PDF belum siap.");return}const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:[80,130]});const center=40;pdf.setFont("helvetica","bold");pdf.setFontSize(13);pdf.text("ARISAN ARFA",center,10,{align:"center"});pdf.setFontSize(8);pdf.setFont("helvetica","normal");pdf.text("Sejahtera",center,15,{align:"center"});pdf.line(8,19,72,19);pdf.setFont("helvetica","bold");pdf.setFontSize(10);pdf.text("BUKTI PEMENANG ARISAN",center,26,{align:"center"});pdf.setFont("helvetica","normal");pdf.setFontSize(8);let y=35;pdf.text("Arisan",8,y);pdf.text(": "+(dataArisan.nama||"-"),28,y);y+=6;pdf.text("Putaran",8,y);pdf.text(": "+periode,28,y);y+=6;pdf.text("Pemenang",8,y);pdf.text(": "+(pemenang.nama||pemenangId),28,y);y+=10;pdf.line(8,y,72,y);y+=8;pdf.text("Total Iuran",8,y);pdf.text(rupiah(totalKas),72,y,{align:"right"});y+=6;pdf.text("Jasa Kas",8,y);pdf.text(rupiah(jasa),72,y,{align:"right"});y+=7;pdf.setFont("helvetica","bold");pdf.text("DITERIMA",8,y);pdf.text(rupiah(diterima),72,y,{align:"right"});y+=12;pdf.setFont("helvetica","normal");pdf.setFontSize(7);pdf.text("Tanggal: "+new Date().toLocaleDateString("id-ID"),center,y,{align:"center"});y+=7;pdf.text("Terima kasih",center,y,{align:"center"});pdf.save(`Pemenang-Arisan-${periode}.pdf`);}
function confetti(){const jml=90;for(let i=0;i<jml;i++){const el=document.createElement("div");el.style.position="fixed";el.style.left=Math.random()*100+"vw";el.style.top="-10px";el.style.width="8px";el.style.height="14px";el.style.background=`hsl(${Math.random()*360},90%,55%)`;el.style.zIndex="99999";el.style.pointerEvents="none";el.style.borderRadius="2px";document.body.appendChild(el);const dur=1800+Math.random()*2200,rot=Math.random()*720;el.animate([{transform:"translateY(0) rotate(0deg)",opacity:1},{transform:`translateY(110vh) rotate(${rot}deg)`,opacity:.9}],{duration:dur,easing:"cubic-bezier(.2,.8,.3,1)"});setTimeout(()=>el.remove(),dur)}}
function tampilError(msg){if(drumTimer){clearInterval(drumTimer);drumTimer=null}roletSedangBerjalan=false;loadingEl.style.display="none";areaKocokEl.style.display="none";winnerEl.classList.remove("show");btnSound.style.display="none";errorEl.style.display="block";errorEl.innerHTML=`<b>⚠️ Tidak dapat menjalankan rolet</b><br><br>${String(msg).replace(/\n/g,"<br>")}`}
btnSound.addEventListener("click",async()=>{if(roletSedangBerjalan)return;try{initAudio();if(audioCtx){if(audioCtx.state==="suspended")await audioCtx.resume();playTestSound()}btnSound.textContent="🔊 Suara Aktif — Memulai...";btnSound.classList.add("active");setTimeout(()=>mulaiRolet(),350)}catch(e){btnSound.textContent="🎰 Mulai Rolet";setTimeout(()=>mulaiRolet(),300)}});
document.getElementById("btnVolMin").onclick=()=>setVolume(-0.1);
document.getElementById("btnVolPlus").onclick=()=>setVolume(0.1);
updateVolumeUI();
(async function(){try{await loadArisan();loadingEl.style.display="none";statusEl.textContent=`Siap! ${daftarTampil.length} nama akan muter, ${daftarKocok.length} bisa menang. Atur volume!`}catch(error){console.error(error);tampilError(error.message||"Terjadi kesalahan.")}})();
</script>
</body>
</html>
