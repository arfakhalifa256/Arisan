<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo",

  authDomain:
    "arfa-c7dee.firebaseapp.com",

  databaseURL:
    "https://arfa-c7dee-default-rtdb.firebaseio.com",

  projectId:
    "arfa-c7dee"

};

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =========================================================
   PARAMETER
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const arisanId =
  params.get("id");


/* =========================================================
   VARIABEL
========================================================= */

let dataArisan = null;

let periode = 1;

let pemenangId = null;

let pemenang = null;

let totalKas = 0;

let jasa = 0;

let diterima = 0;

let daftarKocok = [];

let audioCtx = null;

let drumTimer = null;

let roletSedangBerjalan = false;


/* =========================================================
   ELEMENT
========================================================= */

const loadingEl =
  document.getElementById("loading");

const namaArisanEl =
  document.getElementById("namaArisan");

const putaranEl =
  document.getElementById("putaran");

const namaEl =
  document.getElementById("nama");

const winnerEl =
  document.getElementById("winner");

const namaPemenangEl =
  document.getElementById("namaPemenang");

const nominalEl =
  document.getElementById("nominal");

const detailUangEl =
  document.getElementById("detailUang");

const statusEl =
  document.getElementById("status");

const areaKocokEl =
  document.getElementById("areaKocok");

const roletBoxEl =
  document.getElementById("roletBox");

const errorEl =
  document.getElementById("error");

const btnWA =
  document.getElementById("btnWA");

const btnPrint =
  document.getElementById("btnPrint");

const btnSound =
  document.getElementById("btnSound");


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function rupiah(angka){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(
    Number(angka) || 0
  );

}


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

  }catch(error){

    console.error(
      "Audio tidak tersedia:",
      error
    );

  }

}


/* =========================================================
   TEST SOUND
========================================================= */

function playTestSound(){

  if(!audioCtx) return;

  try{

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(
      700,
      audioCtx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
      1000,
      audioCtx.currentTime + .12
    );

    gain.gain.setValueAtTime(
      .001,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .15,
      audioCtx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + .18
    );

    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime + .2
    );

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   SUARA ROLET
========================================================= */

function playDrum(){

  initAudio();

  if(!audioCtx) return;

  if(audioCtx.state === "suspended"){

    audioCtx.resume();

  }

  if(drumTimer){

    clearInterval(
      drumTimer
    );

    drumTimer = null;

  }

  const mulai =
    Date.now();

  const durasi =
    15000;

  drumTimer =
    setInterval(()=>{

      const elapsed =
        Date.now() - mulai;

      if(elapsed >= durasi){

        clearInterval(
          drumTimer
        );

        drumTimer = null;

        return;

      }

      try{

        const osc =
          audioCtx.createOscillator();

        const gain =
          audioCtx.createGain();

        osc.type = "square";

        /*
          Semakin mendekati akhir,
          suara sedikit lebih rendah.
        */

        let freq =
          180 + Math.random() * 260;

        if(elapsed > 12000){

          freq =
            130 + Math.random() * 180;

        }

        osc.frequency.setValueAtTime(
          freq,
          audioCtx.currentTime
        );

        gain.gain.setValueAtTime(
          .08,
          audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          audioCtx.currentTime + .065
        );

        osc.connect(gain);

        gain.connect(
          audioCtx.destination
        );

        osc.start();

        osc.stop(
          audioCtx.currentTime + .07
        );

      }catch(error){}

    },110);

}


/* =========================================================
   SUARA PEMENANG
========================================================= */

function playMenang(){

  initAudio();

  if(!audioCtx) return;

  if(audioCtx.state === "suspended"){

    audioCtx.resume();

  }

  const nada = [
    523.25,
    659.25,
    783.99,
    1046.50
  ];

  nada.forEach(
    (freq,index)=>{

      setTimeout(()=>{

        try{

          const osc =
            audioCtx.createOscillator();

          const gain =
            audioCtx.createGain();

          osc.type = "sine";

          osc.frequency.value =
            freq;

          gain.gain.setValueAtTime(
            .001,
            audioCtx.currentTime
          );

          gain.gain.exponentialRampToValueAtTime(
            .20,
            audioCtx.currentTime + .03
          );

          gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime + .35
          );

          osc.connect(gain);

          gain.connect(
            audioCtx.destination
          );

          osc.start();

          osc.stop(
            audioCtx.currentTime + .4
          );

        }catch(error){}

      },index * 180);

    }
  );

}


/* =========================================================
   LOAD DATA ARISAN
========================================================= */

async function loadArisan(){

  if(!arisanId){

    throw new Error(
      "ID arisan tidak ditemukan."
    );

  }

  const snap =
    await get(
      ref(
        db,
        `/arisan/${arisanId}`
      )
    );

  if(!snap.exists()){

    throw new Error(
      "Data arisan tidak ditemukan."
    );

  }

  dataArisan =
    snap.val();

  if(
    dataArisan.status &&
    dataArisan.status === "selesai"
  ){

    throw new Error(
      "Arisan ini sudah selesai."
    );

  }

  periode =
    Number(
      dataArisan.periodeSekarang
    ) || 1;

  namaArisanEl.textContent =
    dataArisan.nama ||
    "Arisan";

  putaranEl.textContent =
    "Putaran " + periode;

  await cekSetoran();

}


/* =========================================================
   CEK SETORAN
========================================================= */

async function cekSetoran(){

  const anggota =
    dataArisan.anggota || {};

  const jumlahAnggota =
    Object.keys(anggota).length;

  if(jumlahAnggota < 2){

    throw new Error(
      "Jumlah anggota arisan belum mencukupi."
    );

  }


  const snap =
    await get(
      ref(
        db,
        `/arisan_setoran/${arisanId}/${periode}`
      )
    );

  const dataSetoran =
    snap.exists()
      ? snap.val()
      : {};


  /*
    Ambil anggota yang belum pernah
    mendapatkan arisan.
  */

  let belum =
    Object.entries(
      anggota
    ).filter(
      ([id,a]) =>
        a &&
        a.sudahDapat !== true
    );


  /*
    Cek anggota yang dikunci
    sebagai pemenang terakhir.
    
    Informasi kunci TIDAK ditampilkan
    ke pengguna.
  */

  const kunci =
    belum.find(
      ([id,a]) =>
        a.kunciTerakhir === true
    );


  /*
    Jika ada anggota yang dikunci
    dan masih ada anggota lain,
    anggota tersebut tidak ikut kocok.
  */

  if(
    kunci &&
    belum.length > 1
  ){

    belum =
      belum.filter(
        ([id]) =>
          id !== kunci[0]
      );

  }


  /*
    Jika hanya tersisa anggota kunci,
    tetap boleh menjadi peserta.
  */

  if(
    belum.length === 0 &&
    kunci
  ){

    belum = [kunci];

  }


  if(belum.length === 0){

    throw new Error(
      "Tidak ada anggota yang dapat dikocok."
    );

  }


  /*
    Cek siapa yang sudah setor
    pada periode ini.
  */

  const belumSetor =
    belum.filter(
      ([id]) =>
        !dataSetoran[id]
    );


  if(belumSetor.length > 0){

    const namaBelum =
      belumSetor.map(
        ([id,a]) =>
          a.nama || id
      );

    throw new Error(
      "Belum semua anggota membayar iuran periode ini:\n\n" +
      namaBelum.join(", ")
    );

  }


  daftarKocok =
    belum.map(
      ([id]) => id
    );


  if(
    daftarKocok.length === 0
  ){

    throw new Error(
      "Daftar peserta kosong."
    );

  }

}


/* =========================================================
   MULAI ROLET
========================================================= */

async function mulaiRolet(){

  if(roletSedangBerjalan){

    return;

  }

  if(
    !daftarKocok ||
    daftarKocok.length === 0
  ){

    tampilError(
      "Tidak ada peserta yang dapat dikocok."
    );

    return;

  }

  roletSedangBerjalan = true;

  btnSound.disabled = true;

  btnSound.classList.add(
    "active"
  );

  btnSound.textContent =
    "🔊 Rolet Sedang Berjalan...";

  areaKocokEl.style.display =
    "block";

  winnerEl.classList.remove(
    "show"
  );

  roletBoxEl.classList.add(
    "berputar"
  );

  statusEl.textContent =
    "🎰 Pengundian sedang berlangsung...";

  playDrum();


  /*
    Durasi total = 15 detik.
  */

  const durasi =
    15000;

  const mulai =
    Date.now();

  let index =
    Math.floor(
      Math.random() *
      daftarKocok.length
    );


  /*
    Fungsi mengambil nama peserta.
  */

  function getNama(id){

    const a =
      dataArisan.anggota?.[id];

    return (
      a?.nama ||
      id
    );

  }


  /*
    Loop animasi.
    Awalnya cepat,
    kemudian semakin lambat.
  */

  while(true){

    const elapsed =
      Date.now() - mulai;

    if(elapsed >= durasi){

      break;

    }


    /*
      Pilih peserta berikutnya.
    */

    index =
      (index + 1) %
      daftarKocok.length;

    const id =
      daftarKocok[index];

    namaEl.textContent =
      getNama(id);


    /*
      Kecepatan animasi.
    */

    let delay = 70;

    if(elapsed >= 8000){

      delay = 105;

    }

    if(elapsed >= 10500){

      delay = 145;

    }

    if(elapsed >= 12000){

      delay = 200;

    }

    if(elapsed >= 13500){

      delay = 300;

    }

    if(elapsed >= 14500){

      delay = 500;

    }


    /*
      Jangan sampai melebihi
      durasi 15 detik.
    */

    const sisa =
      durasi - elapsed;

    if(delay > sisa){

      delay = sisa;

    }

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          delay
        )
    );

  }


  /*
    Hentikan suara.
  */

  if(drumTimer){

    clearInterval(
      drumTimer
    );

    drumTimer = null;

  }


  /*
    Tentukan pemenang secara acak.
  */

  const randomIndex =
    Math.floor(
      Math.random() *
      daftarKocok.length
    );

  pemenangId =
    daftarKocok[randomIndex];

  pemenang =
    dataArisan.anggota?.[
      pemenangId
    ] || {};


  /*
    Tampilkan nama pemenang.
  */

  namaEl.textContent =
    pemenang.nama ||
    pemenangId;

  statusEl.textContent =
    "🎉 Pemenang telah ditentukan!";

  roletBoxEl.classList.remove(
    "berputar"
  );


  /*
    Beri sedikit jeda sebelum
    proses penyimpanan.
  */

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        700
      )
  );


  await prosesPemenang();

}


/* =========================================================
   PROSES PEMENANG
========================================================= */

async function prosesPemenang(){

  try{

    /*
      Total kas:
      iuran × jumlah anggota
    */

    const iuran =
      Number(
        dataArisan.iuran
      ) || 0;

    const jumlahAnggota =
      Number(
        dataArisan.jumlahAnggota
      ) ||
      Object.keys(
        dataArisan.anggota || {}
      ).length;

    totalKas =
      iuran *
      jumlahAnggota;


    /*
      Jasa kas.
    */

    jasa =
      Number(
        dataArisan.jasaKas
      ) || 0;


    /*
      Uang yang diterima pemenang.
    */

    diterima =
      Math.max(
        0,
        totalKas - jasa
      );


    /*
      Simpan transaksi.
    */

    const transaksiRef =
      push(
        ref(
          db,
          `/arisan_transaksi/${arisanId}/${periode}`
        )
      );

    await set(
      transaksiRef,
      {
        tanggal:
          new Date().toISOString(),

        pemenangId:
          pemenangId,

        totalKas:
          totalKas,

        jasaRp:
          jasa,

        diterima:
          diterima,

        metode:
          "rolet",

        periode:
          periode,

        namaPemenang:
          pemenang.nama ||
          pemenangId
      }
    );


    /*
      Tandai pemenang sudah mendapat.
    */

    await update(
      ref(
        db,
        `/arisan/${arisanId}/anggota/${pemenangId}`
      ),
      {
        sudahDapat:true,

        totalSetor:
          Number(
            pemenang.totalSetor
          ) || totalKas
      }
    );


    /*
      Hitung periode berikutnya.
    */

    const anggotaIds =
      Object.keys(
        dataArisan.anggota || {}
      );

    const sudahMenang =
      anggotaIds.filter(
        id => {

          if(
            id === pemenangId
          ){

            return true;

          }

          return (
            dataArisan
              .anggota?.[id]
              ?.sudahDapat === true
          );

        }
      ).length;


    /*
      Jika semua anggota sudah
      mendapatkan giliran,
      arisan selesai.
    */

    if(
      sudahMenang >=
      anggotaIds.length
    ){

      await update(
        ref(
          db,
          `/arisan/${arisanId}`
        ),
        {
          status:"selesai",

          periodeSekarang:
            periode
        }
      );

    }else{

      await update(
        ref(
          db,
          `/arisan/${arisanId}`
        ),
        {
          periodeSekarang:
            periode + 1
        }
      );

    }


    /*
      Simpan log aktivitas.
    */

    try{

      const logRef =
        push(
          ref(
            db,
            "/log_aktivitas"
          )
        );

      await set(
        logRef,
        {
          waktu:
            new Date().toISOString(),

          aksi:
            "KOCOK_ARISAN",

          arisanId:
            arisanId,

          periode:
            periode,

          pemenang:
            pemenang.nama ||
            pemenangId,

          nominal:
            diterima
        }
      );

    }catch(logError){

      console.warn(
        "Log gagal disimpan:",
        logError
      );

    }


    /*
      Tampilkan hasil.
    */

    tampilkanPemenang();

  }catch(error){

    console.error(error);

    tampilError(
      "Pemenang sudah ditentukan tetapi terjadi masalah saat menyimpan data: " +
      error.message
    );

  }

}


/* =========================================================
   TAMPILKAN PEMENANG
========================================================= */

function tampilkanPemenang(){

  roletSedangBerjalan =
    false;

  areaKocokEl.style.display =
    "none";

  winnerEl.classList.add(
    "show"
  );


  namaPemenangEl.textContent =
    pemenang.nama ||
    pemenangId;


  nominalEl.textContent =
    rupiah(
      diterima
    );


  detailUangEl.innerHTML =
    `
      Total iuran:
      <b>${rupiah(totalKas)}</b>
      <br>

      Jasa kas:
      <b>${rupiah(jasa)}</b>
      <br>

      Diterima:
      <b>${rupiah(diterima)}</b>
    `;


  /*
    Sembunyikan tombol suara
    setelah proses selesai.
  */

  btnSound.style.display =
    "none";


  playMenang();


  /*
    Confetti sederhana.
  */

  confetti();


  /*
    WhatsApp.
  */

  const hp =
    pemenang.hp ||
    pemenang.telepon ||
    pemenang.noTelepon ||
    "";


  const nomor =
    String(hp)
      .replace(/\D/g,"")
      .replace(/^0/,"62");


  const pesan =
`🎉 *PEMENANG ARISAN KOPERASI ARFA*

Nama: ${pemenang.nama || pemenangId}
Arisan: ${dataArisan.nama || "-"}
Putaran: ${periode}

Total Iuran: ${rupiah(totalKas)}
Jasa Kas: ${rupiah(jasa)}
Diterima: ${rupiah(diterima)}

Selamat kepada pemenang! 🎊

_Koperasi ARFA Sejahtera_`;


  btnWA.onclick =
    ()=>{

      const url =
        nomor
          ? `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`
          : `https://wa.me/?text=${encodeURIComponent(pesan)}`;

      window.open(
        url,
        "_blank"
      );

    };


  /*
    Cetak nota.
  */

  btnPrint.onclick =
    ()=>{

      cetakNota();

    };

}

/* =========================================================
   CONFETTI
========================================================= */

function confetti(){

  const jumlah =
    90;

  for(
    let i=0;
    i<jumlah;
    i++
  ){

    const el =
      document.createElement(
        "div"
      );

    el.style.position =
      "fixed";

    el.style.left =
      Math.random()*100 +
      "vw";

    el.style.top =
      "-10px";

    el.style.width =
      "8px";

    el.style.height =
      "14px";

    el.style.background =
      `hsl(${Math.random()*360},90%,55%)`;

    el.style.zIndex =
      "99999";

    el.style.pointerEvents =
      "none";

    el.style.borderRadius =
      "2px";

    document.body.appendChild(
      el
    );


    const durasi =
      1800 +
      Math.random()*2200;


    const rotasi =
      Math.random()*720;


    el.animate(
      [
        {
          transform:
            "translateY(0) rotate(0deg)",
          opacity:1
        },
        {
          transform:
            `translateY(110vh) rotate(${rotasi}deg)`,
          opacity:.9
        }
      ],
      {
        duration:
          durasi,

        easing:
          "cubic-bezier(.2,.8,.3,1)"
      }
    );


    setTimeout(
      ()=>{
        el.remove();
      },
      durasi
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function tampilError(message){

  if(drumTimer){

    clearInterval(
      drumTimer
    );

    drumTimer = null;

  }

  roletSedangBerjalan =
    false;

  loadingEl.style.display =
    "none";

  areaKocokEl.style.display =
    "none";

  winnerEl.classList.remove(
    "show"
  );

  btnSound.style.display =
    "none";

  errorEl.style.display =
    "block";

  errorEl.innerHTML =
    `
      <b>⚠️ Tidak dapat menjalankan rolet</b>
      <br><br>
      ${String(message)
        .replace(/\n/g,"<br>")}
    `;

}


/* =========================================================
   TOMBOL AKTIFKAN SUARA
========================================================= */

btnSound.addEventListener(
  "click",
  async ()=>{

    if(roletSedangBerjalan){

      return;

    }

    try{

      /*
        Ini penting untuk Android/Chrome.
        AudioContext harus dibuat/resume
        dari interaksi user.
      */

      initAudio();

      if(audioCtx){

        if(
          audioCtx.state ===
          "suspended"
        ){

          await audioCtx.resume();

        }

        playTestSound();

      }


      btnSound.textContent =
        "🔊 Suara Aktif — Memulai...";

      btnSound.classList.add(
        "active"
      );


      /*
        Beri jeda kecil supaya
        suara aktivasi terdengar,
        lalu mulai rolet.
      */

      setTimeout(
        ()=>{
          mulaiRolet();
        },
        350
      );

    }catch(error){

      console.error(
        error
      );

      /*
        Tetap jalankan rolet
        walaupun audio gagal.
      */

      btnSound.textContent =
        "🎰 Mulai Rolet";

      setTimeout(
        ()=>{
          mulaiRolet();
        },
        300
      );

    }

  }
);

    tampilError(

    );

})();
