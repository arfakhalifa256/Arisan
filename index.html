<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARFA Koperasi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-touch-icon" content="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f1f5f9;min-height:100vh}
header{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;padding-top:calc(18px + env(safe-area-inset-top))}
.brand{font-weight:800;display:flex;gap:10px;align-items:center;font-size:18px}
.container{padding:20px;max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.menu{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;transition:.2s}
.menu:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.menu .material-icons{font-size:40px;color:#2563eb;margin-bottom:10px}
.menu b{display:block;font-size:14px;color:#1e293b}
.menu small{color:#64748b;font-size:11px}
.card-welcome{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:16px;padding:20px}
.install{margin-top:16px;background:#fff;color:#2563eb;padding:10px 14px;border-radius:10px;border:none;font-weight:700;width:100%;display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="material-icons">account_balance</span> KOPERASI ARFA</div>
  <span class="material-icons">person</span>
</header>

<div class="container">
  <div class="card-welcome">
    <h2 style="font-size:20px">Selamat Datang 👋</h2>
    <p style="font-size:12px;opacity:.9;margin-top:6px">Kelola arisan, simpan pinjam, dan anggota dalam satu aplikasi</p>
    <button id="btnInstall" class="install">📲 Install Aplikasi</button>
  </div>

  <div class="grid">
    <div class="menu" onclick="location.href='arisan.html'">
      <span class="material-icons">groups</span>
      <b>Arisan</b>
      <small>Kelola putaran & setor</small>
    </div>
    <div class="menu" onclick="location.href='arisan-kunci.html'">
      <span class="material-icons">vpn_key</span>
      <b>Kunci Arisan</b>
      <small>Atur terkunci terakhir</small>
    </div>
    <div class="menu" onclick="alert('Segera hadir')">
      <span class="material-icons">savings</span>
      <b>Simpan Pinjam</b>
      <small>Segera</small>
    </div>
    <div class="menu" onclick="alert('Segera hadir')">
      <span class="material-icons">receipt_long</span>
      <b>Laporan</b>
      <small>Log aktivitas</small>
    </div>
  </div>

  <p style="text-align:center;margin-top:30px;color:#94a3b8;font-size:11px">ARFA v3.0 • PWA Standalone</p>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// Tombol Install PWA
let deferredPrompt;
const btnInstall = document.getElementById('btnInstall');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = 'block';
});
btnInstall.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') btnInstall.style.display = 'none';
  deferredPrompt = null;
});
</script>
</body>
</html>
