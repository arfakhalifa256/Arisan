<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arisan Koperasi ARFA</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#3b82f6;--primary-dark:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--danger:#dc2626;--success:#10b981;--warning:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:var(--text);font-size:13px}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.container{padding:15px;max-width:900px;margin:0 auto}
.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.08)}
h2{margin-bottom:12px;font-size:16px;color:var(--primary-dark)} h3{margin-top:15px;font-size:14px}
.form-group{margin-bottom:12px} label{display:block;margin-bottom:5px;font-weight:600;font-size:12px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--primary)}
button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600} button:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;width:100%}.btn-warning{background:var(--warning);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-info{background:#0ea5e9;color:#fff}
.list{display:flex;flex-direction:column;gap:10px;margin-top:15px}
.item{background:#fff;padding:12px;border-radius:10px;border:1px solid #e5e7eb}
.item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:20px;font-size:10px;color:#fff;font-weight:600}.badge.aktif{background:var(--success)}.badge.selesai{background:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.member-tag{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:20px;font-size:11px;margin:2px;display:inline-flex;align-items:center;gap:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:999}.modal.show{display:flex}
.modal-content{background:#fff;width:95%;max-width:600px;border-radius:12px;padding:15px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:10px 15px;border-radius:8px;opacity:0;transition:.3s;z-index:9999}.toast.show{opacity:1}
.tabel-setor{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}.tabel-setor th,.tabel-setor td{padding:8px;border-bottom:1px solid #eee;text-align:left}.tabel-setor th{background:#f8fafc;font-weight:600}.tabel-setor input[type=checkbox]{width:18px;height:18px}
tr.lunas{background:#dcfce7}
.btn-kecil{padding:5px 8px;font-size:11px}.btn-wa{background:#25D366;color:#fff;padding:4px 7px;border-radius:20px;font-size:10px;display:inline-flex;align-items:center;gap:3px;text-decoration:none}
.empty{text-align:center;color:#888;padding:15px}
.icon-kunci-samar{font-size:18px;color:#9ca3af;background:#f3f4f6;padding:6px;border-radius:50%;cursor:pointer}.icon-kunci-samar:hover{background:#dbeafe;color:var(--primary)}
.info-rolet{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px;margin-top:12px;font-size:11px}
@media(max-width:600px){.grid-2{grid-template-columns:1fr}}
</style>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">


</head>
<body>
<header><div class="brand"><span class="material-icons">groups</span> ARISAN KOPERASI</div><span onclick="window.location='index.html'" class="material-icons" style="cursor:pointer">home</span></header>
<div class="container">
  <div class="card">
    <h2>+ Buat Arisan Baru</h2>
    <div class="form-group"><label>Nama Arisan</label><input type="text" id="namaArisan" placeholder="Contoh: Arisan Ibu-ibu"></div>
    <div class="grid-2"><div class="form-group"><label>Jumlah Iuran</label><input type="number" id="iuran" placeholder="100000" min="1000"></div><div class="form-group"><label>Periode</label><select id="periode"><option value="mingguan">Mingguan</option><option value="bulanan">Bulanan</option></select></div></div>
    <div class="form-group"><label>Tambah Anggota</label><input type="text" id="inputNamaAnggota" placeholder="Nama Anggota" style="margin-bottom:6px"><input type="text" id="inputHpAnggota" placeholder="No HP 08xxx"><button class="btn-success" style="margin:10px 0" onclick="tambahAnggotaManual()">+ Tambah Anggota</button><div id="listAnggotaPreview" style="display:flex;flex-wrap:wrap;gap:6px"></div></div>
    <button class="btn-primary" id="btnBuatArisan">Buat Arisan</button>
  </div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2>Daftar Arisan</h2><select id="filterStatus" style="width:auto;padding:6px 10px"><option value="semua">Semua</option><option value="aktif">Aktif</option><option value="selesai">Selesai</option></select></div><div class="list" id="listArisan"></div></div>
</div>

<div id="modalDetail" class="modal"><div class="modal-content">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 id="detailJudul">Detail Arisan</h2><div style="display:flex;gap:6px;align-items:center"><span onclick="bukaHalamanKunci()" class="material-icons icon-kunci-samar" title="Kelola Kunci">vpn_key</span><span onclick="tutupModal()" class="material-icons" style="cursor:pointer">close</span></div></div>
<div id="detailInfo" style="margin-top:8px"></div>
<div class="info-rolet"><b>Kocok di Halaman Baru</b><br><br>Tekan tombol kocok, animasi rolet dibuka penuh di window baru.</div>
<h3>Daftar Anggota</h3><div style="overflow-x:auto"><table class="tabel-setor"><thead><tr><th>Nama</th><th>No HP</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbodyAnggota"></tbody></table></div>
<h3>Input Setoran Putaran <span id="txtPeriodeSekarang"></span></h3><div style="overflow-x:auto"><table class="tabel-setor"><thead><tr><th width="40">Lunas</th><th>Nama</th><th>No HP</th><th>Jumlah</th></tr></thead><tbody id="tabelSetoran"></tbody></table></div>
<div class="grid-2" style="margin-top:10px"><div class="form-group"><label>Potongan Jasa Kas Rp</label><input type="number" id="inputJasa" value="0" min="0"></div><div class="form-group"><label>Total Diterima</label><input type="text" id="inputDiterima" readonly style="background:#f3f4f6;font-weight:700;color:var(--success)"></div></div>
<div style="margin-top:12px"><button class="btn-warning" id="btnPutaran" style="width:100%;padding:14px">🎲 Kocok di Halaman Baru</button></div>
<button class="btn-danger btn-kecil" style="width:100%;margin-top:8px" id="btnHapusArisan">🗑️ Hapus Arisan Ini</button>
<h3>Riwayat Putaran</h3><div class="list" id="listRiwayat"></div>
</div></div>

<div id="modalEditAnggota" class="modal"><div class="modal-content"><h3>Edit Anggota</h3><input type="hidden" id="editAnggotaId"><div class="form-group"><label>Nama</label><input type="text" id="editNamaAnggota"></div><div class="form-group"><label>No HP</label><input type="text" id="editHpAnggota"></div><div class="grid-2"><button class="btn-primary" onclick="simpanEditAnggota()">Simpan</button><button class="btn-danger" onclick="tutupModalEditAnggota()">Batal</button></div></div></div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = { apiKey: "AIzaSyDd0s73-qW2uiOlBWR-afybFZzMafCHeSo", authDomain: "arfa-c7dee.firebaseapp.com", databaseURL: "https://arfa-c7dee-default-rtdb.firebaseio.com", projectId: "arfa-c7dee" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// TANPA ROLEBASE - SIAPA AJA BISA BUKA
const username = localStorage.getItem("username") || "User";
const role = localStorage.getItem("role") || "user";

  
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('SW registered'))
    .catch((e) => console.log('SW failed', e));
}
  
let dataArisan = {};
let arisanAktifId = null;
let filterSaatIni = "semua";
let anggotaSementara = [];

const rupiah = n => "Rp " + Number(n || 0).toLocaleString("id-ID");
function showToast(m){ const t=document.getElementById("toast"); t.innerText=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2500); }
function formatWA(no){ if(!no) return ""; let num=String(no).trim().replace(/\D/g,""); if(num.startsWith("0")) num="62"+num.substring(1); else if(num.startsWith("8")) num="62"+num; return num; }
function buatLinkWA(no,p=""){ const n=formatWA(no); if(!n) return ""; return "https://wa.me/"+n+"?text="+encodeURIComponent(p); }
function nomorWAValid(no){ const n=formatWA(no); return n.startsWith("62")&&n.length>=10; }
function escapeHTML(t){ return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function escapeJS(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," "); }
function simpanLog(aksi,data){ try{ push(ref(db,"/log_aktivitas"),{ waktu:Date.now(), waktu_baca:new Date().toLocaleString("id-ID",{timeZone:"Asia/Jakarta"}), aksi, oleh:username, role,...data }); }catch(e){} }

window.tambahAnggotaManual=function(){ const nama=document.getElementById("inputNamaAnggota").value.trim(); const hp=document.getElementById("inputHpAnggota").value.trim(); if(!nama){ alert("Nama wajib"); return; } const id="agt_"+Date.now(); anggotaSementara.push({id,nama,hp}); renderPreview(); document.getElementById("inputNamaAnggota").value=""; document.getElementById("inputHpAnggota").value=""; };
function renderPreview(){ const d=document.getElementById("listAnggotaPreview"); d.innerHTML=""; anggotaSementara.forEach((a,i)=>{ d.innerHTML+=`<span class="member-tag">${escapeHTML(a.nama)} <span onclick="hapusPreview(${i})" style="cursor:pointer;font-weight:bold">×</span></span>`; }); }
window.hapusPreview=function(i){ anggotaSementara.splice(i,1); renderPreview(); };

onValue(ref(db,"arisan"),s=>{ dataArisan=s.val()||{}; renderList(); if(arisanAktifId && dataArisan[arisanAktifId]){ const modal=document.getElementById("modalDetail"); if(modal.classList.contains("show")) bukaDetail(arisanAktifId); } });
document.getElementById("filterStatus").addEventListener("change",e=>{ filterSaatIni=e.target.value; renderList(); });

function renderList(){
  const list=document.getElementById("listArisan"); let data=Object.entries(dataArisan);
  if(filterSaatIni!=="semua") data=data.filter(([id,a])=>a.status===filterSaatIni);
  data.sort((a,b)=>Number(b[1].tanggalBuat||0)-Number(a[1].tanggalBuat||0));
  if(data.length===0){ list.innerHTML=`<div class="empty">Tidak ada arisan</div>`; return; }
  list.innerHTML="";
  data.forEach(([id,a])=>{ list.innerHTML+=`<div class="item"><div class="item-top"><div><b>${escapeHTML(a.nama)}</b><br><small>${escapeHTML(a.periode)} - ${a.jumlahAnggota} Anggota</small></div><div class="badge ${a.status}">${(a.status||"aktif").toUpperCase()}</div></div><div>Iuran: <b>${rupiah(a.iuran)}</b></div><div style="font-size:11px;color:#666">Putaran: ${a.periodeSekarang||1}/${a.jumlahAnggota}</div><div class="grid-2" style="margin-top:8px"><button class="btn-primary" onclick="bukaDetail('${id}')">Kelola</button><button class="btn-danger btn-kecil" onclick="hapusList('${id}','${escapeJS(a.nama)}')">🗑️ Hapus</button></div></div>`; });
}

document.getElementById("btnBuatArisan").onclick=async()=>{
  const nama=document.getElementById("namaArisan").value.trim();
  const iuran=Number(document.getElementById("iuran").value);
  const periode=document.getElementById("periode").value;
  if(!nama||!iuran||iuran<1000||anggotaSementara.length<2){ alert("Lengkapi data minimal 2 anggota"); return; }
  const btn=document.getElementById("btnBuatArisan"); btn.disabled=true; btn.innerText="Menyimpan...";
  try{
    const baru=push(ref(db,"arisan")); const obj={};
    anggotaSementara.forEach(a=>{ obj[a.id]={...a,sudahDapat:false,totalSetor:0,kunciTerakhir:false}; });
    await set(baru,{nama,iuran,periode,status:"aktif",jumlahAnggota:anggotaSementara.length,anggota:obj,periodeSekarang:1,tanggalBuat:Date.now()});
    simpanLog("BUAT_ARISAN",{namaArisan:nama,iuran}); showToast("Arisan dibuat"); document.getElementById("namaArisan").value=""; document.getElementById("iuran").value=""; anggotaSementara=[]; renderPreview();
  }catch(e){ alert(e.message); }finally{ btn.disabled=false; btn.innerText="Buat Arisan"; }
};

window.bukaDetail=async function(id){
  arisanAktifId=id; const a=dataArisan[id]; if(!a) return;
  document.getElementById("detailJudul").innerText=a.nama;
  document.getElementById("txtPeriodeSekarang").innerText="P"+(a.periodeSekarang||1);
  const belum=Object.entries(a.anggota||{}).filter(([k,v])=>!v.sudahDapat).length;
  document.getElementById("detailInfo").innerHTML=`<p><b>Putaran:</b> ${a.periodeSekarang||1}/${a.jumlahAnggota}</p><p><b>Iuran:</b> ${rupiah(a.iuran)}</p><p><b>Sisa:</b> ${belum} orang</p>`;
  renderAnggota(a); await renderSetoran(a); await loadRiwayat(id); hitungDiterima();
  document.getElementById("inputJasa").oninput=hitungDiterima;
  document.getElementById("modalDetail").classList.add("show");
};
window.tutupModal=function(){ document.getElementById("modalDetail").classList.remove("show"); };
window.bukaHalamanKunci=function(){ if(!arisanAktifId) return; window.location=`arisan-kunci.html?id=${encodeURIComponent(arisanAktifId)}`; };

function renderAnggota(a){
  const tbody=document.getElementById("tbodyAnggota"); tbody.innerHTML="";
  Object.entries(a.anggota||{}).forEach(([id,ag])=>{
    const st=ag.sudahDapat? `<span style="color:var(--success)">Sudah P${ag.periodeDapat||''}</span>` : `<span style="color:var(--warning)">Belum</span>`;
    const wa=ag.hp&&nomorWAValid(ag.hp)? `<a href="${buatLinkWA(ag.hp)}" target="_blank" class="btn-wa">WA</a>` : "";
    tbody.innerHTML+=`<tr><td>${escapeHTML(ag.nama)}</td><td>${escapeHTML(ag.hp||"-")} ${wa}</td><td>${st}</td><td><button class="btn-info btn-kecil" onclick="bukaEdit('${id}')">✏️</button></td></tr>`;
  });
}
window.bukaEdit=function(id){ const ag=dataArisan[arisanAktifId].anggota[id]; document.getElementById("editAnggotaId").value=id; document.getElementById("editNamaAnggota").value=ag.nama; document.getElementById("editHpAnggota").value=ag.hp||""; document.getElementById("modalEditAnggota").classList.add("show"); };
window.tutupModalEditAnggota=function(){ document.getElementById("modalEditAnggota").classList.remove("show"); };
window.simpanEditAnggota=async function(){ const id=document.getElementById("editAnggotaId").value; const nama=document.getElementById("editNamaAnggota").value.trim(); const hp=document.getElementById("editHpAnggota").value.trim(); if(!nama) return; await update(ref(db,`arisan/${arisanAktifId}/anggota/${id}`),{nama,hp}); showToast("Update"); tutupModalEditAnggota(); };

function hitungDiterima(){ if(!arisanAktifId) return; const a=dataArisan[arisanAktifId]; if(!a) return; const total=Number(a.iuran||0)*Number(a.jumlahAnggota||0); const jasa=Number(document.getElementById("inputJasa").value)||0; document.getElementById("inputDiterima").value=rupiah(Math.max(0,total-jasa)); }

async function renderSetoran(a){
  const tbody=document.getElementById("tabelSetoran"); tbody.innerHTML=""; const periode=Number(a.periodeSekarang||1);
  const snap=await get(ref(db,`arisan_setoran/${arisanAktifId}/${periode}`)); const dataSetor=snap.val()||{};
  Object.entries(a.anggota||{}).forEach(([id,ag])=>{
    const lunas=dataSetor[id]?.status==="lunas";
    const wa=ag.hp&&nomorWAValid(ag.hp)? `<a href="${buatLinkWA(ag.hp,`Halo ${ag.nama}, iuran ${a.nama} P${periode} ${rupiah(a.iuran)}`)}" target="_blank" class="btn-wa">WA</a>` : "";
    tbody.innerHTML+=`<tr class="${lunas?"lunas":""}"><td><input type="checkbox" class="cbSetor" data-id="${id}" ${lunas?"checked":""}></td><td>${escapeHTML(ag.nama)}</td><td>${escapeHTML(ag.hp||"-")} ${wa}</td><td>${rupiah(a.iuran)}</td></tr>`;
  });
  document.querySelectorAll(".cbSetor").forEach(cb=>{ cb.addEventListener("change",async function(){ const aid=this.dataset.id; const ag=dataArisan[arisanAktifId].anggota[aid]; if(this.checked){ await set(ref(db,`arisan_setoran/${arisanAktifId}/${periode}/${aid}`),{jumlah:Number(a.iuran),tanggal:Date.now(),status:"lunas"}); this.closest("tr").classList.add("lunas"); simpanLog("SETOR_ARISAN",{nama:ag.nama,namaArisan:a.nama,periode}); showToast(`${ag.nama} lunas`); }else{ await set(ref(db,`arisan_setoran/${arisanAktifId}/${periode}/${aid}`),null); this.closest("tr").classList.remove("lunas"); } }); });
}

document.getElementById("btnPutaran").onclick=function(){
  if(!arisanAktifId){ alert("Pilih arisan dulu"); return; }
  const a=dataArisan[arisanAktifId]; if(a.status==="selesai"){ alert("Selesai"); return; }
  const url=`arisan-rolet.html?id=${encodeURIComponent(arisanAktifId)}`;
  const win=window.open(url,"_blank","width=1000,height=800"); if(!win){ alert("Pop-up diblokir"); return; } try{win.focus();}catch(e){}
};

document.getElementById("btnHapusArisan").onclick=async()=>{ if(!arisanAktifId) return; const a=dataArisan[arisanAktifId]; await hapusList(arisanAktifId,a?.nama||"Arisan"); tutupModal(); };
window.hapusList=async function(id,nama){ if(!confirm(`Hapus ${nama}?`)) return; try{ await set(ref(db,`arisan/${id}`),null); await set(ref(db,`arisan_setoran/${id}`),null); await set(ref(db,`arisan_transaksi/${id}`),null); simpanLog("HAPUS_ARISAN",{namaArisan:nama}); showToast("Dihapus"); }catch(e){ alert(e.message); } };

async function loadRiwayat(id){
  const snap=await get(ref(db,`arisan_transaksi/${id}`)); const data=snap.val()||{}; const list=document.getElementById("listRiwayat"); list.innerHTML="";
  if(Object.keys(data).length===0){ list.innerHTML=`<p style="color:#888;text-align:center">Belum ada putaran</p>`; return; }
  let anggota=dataArisan[id]?.anggota||{}; if(Object.keys(anggota).length===0){ const sA=await get(ref(db,`arisan/${id}/anggota`)); anggota=sA.val()||{}; }
  Object.entries(data).sort((a,b)=>Number(a[0])-Number(b[0])).forEach(([periode,t])=>{
    let namaPemenang=t.namaPemenang|| (t.pemenangId&&anggota[t.pemenangId]?.nama) || t.pemenangId || "-";
    const tanggal=t.tanggal? new Date(t.tanggal).toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"}) : "-";
    list.innerHTML+=`<div class="item" style="border-left:4px solid var(--primary);padding:14px;"><div style="display:flex;justify-content:space-between"><div><div style="font-size:12px;color:#64748b;font-weight:600">PUTARAN ${periode}</div><div style="font-size:16px;font-weight:800;color:var(--primary-dark)">🏆 ${escapeHTML(namaPemenang)}</div></div><div style="background:#dcfce7;color:#15803d;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700">PEMENANG</div></div><div style="font-size:11px;color:#64748b;border-top:1px solid #eee;padding-top:8px;margin-top:8px"><div>📅 ${tanggal}</div><div>💰 ${rupiah(t.totalKas||0)} - Jasa ${rupiah(t.jasaRp||0)} - Diterima <b style="color:var(--success)">${rupiah(t.diterima||0)}</b></div></div></div>`;
  });
}
</script>
</body>
</html>
